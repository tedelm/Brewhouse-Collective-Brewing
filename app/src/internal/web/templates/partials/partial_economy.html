<section class="panel" data-panel="economy">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="economy.tax.title">Tax rates</h1>
		<p class="panel__lead" id="economy-tax-lead" data-i18n="economy.tax.lead">Beer excise for the active tax jurisdiction. Used on delivery; small-producer discounts by annual volume where applicable.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="economy-refresh" data-i18n="common.refresh">Refresh</button>
	</div>
	<form class="panel__form" id="economy-form" data-require-roles="admin">
		<p class="panel__lead" id="economy-country-label"></p>
		<input type="hidden" name="basis" id="economy-basis" value="">
		<div id="economy-params-fields"></div>
		<label><span data-i18n="economy.tax.discount">Small producer discount</span>
			<select name="discount_key" id="economy-discount" required></select>
		</label>
		<button type="submit" class="btn btn--primary" data-i18n="common.save">Save</button>
		<p class="panel__error" id="economy-error" hidden></p>
	</form>
	<div class="panel__body" id="economy-examples" data-i18n="common.loading">Loading…</div>
</section>
