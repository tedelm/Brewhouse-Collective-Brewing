<section class="panel" data-panel="hygiene">
	<header class="panel__header">
		<h1 class="panel__title" data-i18n="hygiene.title">Hygiene routines</h1>
		<p class="panel__lead" data-i18n="hygiene.lead">Primary path after brewday: check off cleaning routines per batch (or confirm all). Moves the batch to hygiene done so delivery can begin.</p>
	</header>
	<div class="panel__toolbar">
		<button type="button" class="btn" data-action="hygiene-refresh" data-i18n="common.refresh">Refresh</button>
	</div>
	<div class="panel__body" id="hygiene-list" data-i18n="common.loading">Loading…</div>
	<p class="panel__error" id="hygiene-error" hidden></p>
</section>
